<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigrApp - Planificación de Proyectos de Migración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="views/css/styles.css">
</head>
<body>
    <header class="bg-dark text-white p-3">
        <div class="container">
            <h1>MigrApp</h1>
        </div>
    </header>

    <main class="container mt-4">
        <div id="app">
            <div class="container">
                <h2>Gestión de Proyectos</h2>
                <form id="project-form">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre del Proyecto</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Descripción</label>
                        <textarea class="form-control" id="description" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="migrationType" class="form-label">Tipo de Migración</label>
                        <select class="form-select" id="migrationType" required>
                            <option value="datos">Datos</option>
                            <option value="infraestructura">Infraestructura</option>
                            <option value="aplicaciones">Aplicaciones</option>
                            <option value="nube">Nube</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col">
                            <div class="mb-3">
                                <label for="startDate" class="form-label">Fecha de Inicio</label>
                                <input type="date" class="form-control" id="startDate" required>
                            </div>
                        </div>
                        <div class="col">
                            <div class="mb-3">
                                <label for="endDate" class="form-label">Fecha de Fin</label>
                                <input type="date" class="form-control" id="endDate" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="owner" class="form-label">Responsable</label>
                        <input type="text" class="form-control" id="owner" required>
                    </div>
                    <div class="mb-3">
                        <label for="priority" class="form-label">Prioridad</label>
                        <select class="form-select" id="priority" required>
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Estado</label>
                        <select class="form-select" id="status" required>
                            <option value="pendiente">Pendiente</option>
                            <option value="en-progreso">En Progreso</option>
                            <option value="bloqueado">Bloqueado</option>
                            <option value="completado">Completado</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Crear Proyecto</button>
                </form>
                <hr>
                <h2>Lista de Proyectos</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Tipo</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Responsable</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="project-list">
                        <!-- Los proyectos se insertarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p>&copy; 2024 MigrApp</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controllers/ProjectController.js"></script>
    <script src="models/Project.js"></script>
    <script src="views/ProjectView.js"></script>
</body>
</html>
